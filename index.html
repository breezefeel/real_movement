<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F6E4C4;
    --ink: #0B2048;
    --btn-line: #dc143c;
    --btn-text: #dc143c;
    --dots: #C5B7A4;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  .page {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--white);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    margin: 8px 0 18px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.35;
    margin: 0 0 10px;
  }
  .bio {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.7;
    letter-spacing: -0.03em;
    word-break: keep-all;
    max-width: 420px;
    margin: 0 0 16px;
  }
  .ig {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    color: var(--ink);
    margin-bottom: 28px;
    transition: opacity .15s;
  }
  .ig:hover { opacity: 0.65; }
  .ig svg { width: 24px; height: 24px; }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .item { position: relative; width: 100%; }
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 58px;
    padding: 12px 52px;
    background: var(--white);
    color: var(--btn-text);
    text-decoration: none;
    border: 1.5px solid var(--btn-line);
    border-radius: 999px;
    box-sizing: border-box;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(220, 20, 60, 0.14);
  }
  .btn:active { transform: translateY(0); }
  .icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon img,
  .icon svg { width: 100%; height: 100%; display: block; }
  .icon--map { background: transparent; overflow: visible; }
  .icon--map svg { width: 38px; height: 38px; }
  .label {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.3;
    word-break: keep-all;
    pointer-events: none;
  }
  .more {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--dots);
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .more:hover { background: rgba(0,0,0,0.05); color: #8a7d6c; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 999px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @media (max-width: 380px) {
    h1 { font-size: 18px; }
    .bio { font-size: 12.5px; }
    .label { font-size: 13px; }
    .btn { padding: 12px 48px; min-height: 54px; }
  }
</style>
</head>
<body>

  <div class="toast" id="toast" hidden>링크를 복사했습니다</div>

  <script>
    function shareLink(event, btn) {
      event.preventDefault();
      event.stopPropagation();
      var item = btn.closest('.item');
      var a = item && item.querySelector('.btn');
      var url = (a && a.href) || '';
      var title = (a && a.querySelector('.label') && a.querySelector('.label').textContent.trim()) || document.title;
      if (!url) return;
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(function () { copyLink(url); });
      } else {
        copyLink(url);
      }
    }
    function copyLink(url) {
      var toast = document.getElementById('toast');
      var show = function () {
        toast.hidden = false;
        toast.classList.add('show');
        clearTimeout(copyLink._tid);
        copyLink._tid = setTimeout(function () {
          toast.classList.remove('show');
          toast.hidden = true;
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(show).catch(show);
      } else {
        show();
      }
    }
  </script>
