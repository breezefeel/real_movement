  <h1 class="sec-title">어깨가 안 올라가면 흉추부터</h1>
  <p>팔을 위로 들 때 날개뼈는 위로, 밖으로, 뒤로 움직여야 합니다. 흉추가 굳어 있으면 그 길이 막히고, 목과 상부 승모근이 대신 당깁니다.</p>
  <p>그래서 어깨가 안 올라갈수록 어깨만 풀지 않습니다. 등과 날개뼈가 같이 움직이게 되면, 어깨는 비로소 자기 일을 합니다.</p>
