  <h1 class="sec-title">바른 자세가 독이 될 수 있습니다</h1>
  <p>하루 종일 가슴을 열고 턱을 당기면, 그 자세를 유지하는 근육이 먼저 지칩니다. 몸은 하나의 포즈가 아니라 상황에 따라 접히고 펴져야 합니다.</p>
  <p>우리가 원하는 것은 ‘사진 같은 정자세’가 아닙니다. 앉았다가 일어나도, 가방을 들어도, 목을 돌려도 과하게 한곳이 대신하지 않는 상태입니다.</p>
