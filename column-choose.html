  <h1 class="sec-title">기능재활 스튜디오를 고를 때</h1>
  <p>인테리어와 기구 수보다, 첫날에 무엇을 보는지가 기준입니다. 평가 없이 바로 등록을 권하거나, 전후 사진만 보여주고 과정을 설명하지 않으면 오래가기 어렵습니다.</p>
  <ul>
    <li>누가 평가하는가 — 대표원장이 방향을 같이 보는가</li>
    <li>재평가가 있는가 — 느낌이 아니라 움직임으로 확인하는가</li>
    <li>병원과 경계를 말하는가 — 운동으로 가면 안 되는 신호를 알려 주는가</li>
  </ul>
  <p>성수·역삼·약수·인천, 지점이 달라도 이 세 질문은 같습니다.</p>
