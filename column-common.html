  <h1 class="sec-title">모두에게 맞는 운동은 없습니다</h1>
  <p>유튜브 루틴이 나쁜 게 아닙니다. 그 루틴이 <strong>당신의 보상 패턴</strong>을 강화할 수 있다는 점이 문제입니다.</p>
  <p>허리가 불편한 두 사람이 같은 플랭크를 하면, 한 사람은 코어가 살아나고 한 사람은 허리가 더 돕니다. 차이는 고관절이 일을 하는지, 허리가 대신 하는지를 평가해 봐야 드러납니다.</p>
  <p>리얼무브먼트 네 지점은 그래서 첫날에 동작을 많이 넣지 않습니다. 성수·역삼·약수·인천 모두, 먼저 그 몸이 지금 쓰는 길을 봅니다.</p>
